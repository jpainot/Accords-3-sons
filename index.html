<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triades — entraînement</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172033;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:700px;margin:35px auto;text-align:center}h1{font-size:1.6rem;margin-bottom:8px}p{color:#536071}.card{background:white;border:1px solid #dce1e8;border-radius:20px;margin:26px 0 20px;padding:65px 15px;box-shadow:0 5px 24px #1720330a}.chord{font-size:clamp(3.2rem,12vw,6rem);font-weight:750;min-height:1.3em}.count{font-size:1rem;color:#667085}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;border-radius:10px;padding:12px 18px;border:1px solid #aeb7c5;background:white;color:#172033;cursor:pointer;min-height:46px}button.primary{background:#172033;color:white;border-color:#172033}button:disabled{opacity:.5;cursor:not-allowed}label{display:flex;align-items:center;gap:8px}small{display:block;color:#667085;margin-top:22px}.progress{height:6px;background:#e7ebf1;border-radius:8px;overflow:hidden;margin-top:25px}.bar{height:100%;background:#3565a5;width:0%;transition:width .1s linear}
</style>
</head>
<body><main>
<h1>Triades majeures et mineures</h1><p>Trouve et joue l’accord avant d’entendre la triade correspondante.</p>
<section class="card" aria-live="polite"><div class="chord" id="chord">Prêt ?</div><div class="count" id="count">24 accords par série</div><div class="progress"><div class="bar" id="bar"></div></div></section>
<div class="controls"><label for="speed">Temps par accord <select id="speed"><option value="1">1 s</option><option value="2">2 s</option><option value="4">4 s</option><option value="6" selected>6 s</option><option value="8">8 s</option><option value="10">10 s</option><option value="12">12 s</option></select></label><button class="primary" id="start">Démarrer</button><button id="pause" disabled>Pause</button><button id="reset">Recommencer</button></div>
<small>Les 12 triades majeures et les 12 mineures apparaissent dans un ordre aléatoire. À la fin du décompte, chaque accord retentit pendant 1,5 seconde avant le suivant.</small>
</main><script>
(()=>{
  const roots=['Do','Do♯','Ré','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si'];
  const all=roots.flatMap(n=>[n+' majeur',n+' mineur']);
  const $=id=>document.getElementById(id);
  const chord=$('chord'),count=$('count'),bar=$('bar'),speed=$('speed');
  const start=$('start'),pause=$('pause'),reset=$('reset');
  const pitch={'Do':0,'Do♯':1,'Ré':2,'Mi♭':3,'Mi':4,'Fa':5,'Fa♯':6,'Sol':7,'La♭':8,'La':9,'Si♭':10,'Si':11};
  const soundLength=1500;
  let deck=[],idx=-1,remaining=0,last=0,timer=null,running=false,phase='idle';
  let audioCtx=null,voices=[];
  const duration=()=>Number(speed.value)*1000;
  function shuffle(){deck=[...all];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}}
  function context(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx;}
  function silence(){for(const v of voices){try{v.stop()}catch(e){}}voices=[];}
  function playChord(){
    const ctx=context();silence();
    const label=deck[idx];const minor=label.endsWith(' mineur');
    const root=label.replace(/ (majeur|mineur)$/,'');
    const midi=60+pitch[root];
    for(const semitones of [0,minor?3:4,7]){
      const frequency=440*Math.pow(2,(midi+semitones-69)/12);
      const fundamental=ctx.createOscillator(),harmonic=ctx.createOscillator(),gain=ctx.createGain();
      fundamental.type='triangle';fundamental.frequency.value=frequency;
      harmonic.type='sine';harmonic.frequency.value=frequency*2;
      const harmonicGain=ctx.createGain();harmonicGain.gain.value=.12;
      fundamental.connect(gain);harmonic.connect(harmonicGain);harmonicGain.connect(gain);gain.connect(ctx.destination);
      const t=ctx.currentTime;
      gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.13,t+.025);
      gain.gain.exponentialRampToValueAtTime(.075,t+.32);
      gain.gain.setValueAtTime(.075,t+1.25);
      gain.gain.exponentialRampToValueAtTime(.0001,t+1.49);
      fundamental.start(t);harmonic.start(t);fundamental.stop(t+1.5);harmonic.stop(t+1.5);
      voices.push(fundamental,harmonic);
    }
  }
  function display(){chord.textContent=deck[idx];count.textContent=`Accord ${idx+1} sur 24`;phase='countdown';remaining=duration();bar.style.width='0%';}
  function stopClock(){running=false;clearInterval(timer);timer=null;pause.disabled=true;start.disabled=false;speed.disabled=false;}
  function finish(){stopClock();silence();phase='finished';chord.textContent='Terminé !';count.textContent='24 accords parcourus';bar.style.width='100%';start.textContent='Nouvelle série';}
  function tick(){
    const now=performance.now();remaining-=now-last;last=now;
    if(remaining<=0){
      if(phase==='countdown'){
        phase='sound';remaining=soundLength;bar.style.width='100%';count.textContent=`Écoute — accord ${idx+1} sur 24`;playChord();
      }else if(phase==='sound'){
        silence();idx++;if(idx>=deck.length){finish();return;}display();
      }
    }
    if(phase==='countdown')bar.style.width=`${Math.min(100,Math.max(0,100-remaining/duration()*100))}%`;
  }
  async function run(){
    try{await context().resume()}catch(e){console.warn('Audio indisponible',e)}
    running=true;last=performance.now();timer=setInterval(tick,40);
    start.disabled=true;pause.disabled=false;pause.textContent='Pause';speed.disabled=true;
  }
  start.addEventListener('click',()=>{
    if(running)return;
    if(phase==='idle'||phase==='finished'){silence();shuffle();idx=0;display();start.textContent='Démarrer';}
    run();
  });
  pause.addEventListener('click',async()=>{
    if(running){
      clearInterval(timer);timer=null;running=false;
      if(audioCtx&&audioCtx.state==='running')await audioCtx.suspend();
      pause.textContent='Reprendre';
    }else if(phase==='countdown'||phase==='sound'){
      await context().resume();running=true;last=performance.now();timer=setInterval(tick,40);pause.textContent='Pause';
    }
  });
  reset.addEventListener('click',()=>{
    stopClock();silence();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
    idx=-1;deck=[];phase='idle';chord.textContent='Prêt ?';count.textContent='24 accords par série';bar.style.width='0%';start.textContent='Démarrer';pause.textContent='Pause';
  });
  speed.addEventListener('change',()=>{if(phase==='countdown'&&!running)remaining=duration();});
})();
</script></body></html>
